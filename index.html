<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Nāda — Acoustic Science Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<style>
  :root{
    --bg: #1b1815;
    --panel: #221e19;
    --panel-2: #2a251f;
    --brass: #c08a3e;
    --brass-dim: #8f682f;
    --vermillion: #9c3b2e;
    --parchment: #ece3cd;
    --muted: #a89c84;
    --line: #3a332a;
    --pink: #d9678f;
    --pink-light: #f2a9c4;
    --pink-dim: #7a3f52;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--parchment);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width: 760px;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* Header */
  header{
    padding: 22px 22px 14px;
    border-bottom: 1px solid var(--line);
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  header svg.wave{
    position:absolute; left:0; right:0; bottom:-2px; width:100%; height:34px;
    opacity:0.35; pointer-events:none;
  }
  .title-row{ display:flex; align-items:baseline; gap:10px; }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:30px;
    margin:0;
    color: var(--parchment);
    letter-spacing: 0.5px;
  }
  .sanskrit{ font-family:'Fraunces', serif; font-size:19px; color:var(--pink-light); font-weight:500; }
  header p.sub{
    margin: 6px 0 0;
    font-size: 13.5px;
    color: var(--muted);
    max-width: 460px;
    line-height:1.5;
  }
  .sitar{
    position:absolute;
    top: 16px;
    right: 22px;
    width: 74px;
    height: auto;
    opacity: 0.9;
  }

  /* Topic pills */
  .topics{
    display:flex;
    gap:8px;
    padding: 12px 22px;
    overflow-x:auto;
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
    scrollbar-width:none;
  }
  .topics::-webkit-scrollbar{ display:none; }
  .pill{
    flex-shrink:0;
    border:1px solid var(--pink-dim);
    color: var(--pink-light);
    background:transparent;
    border-radius: 3px;
    padding: 7px 13px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .pill:hover{ background: var(--pink); color:#1b1815; }

  /* Messages */
  .messages{
    flex:1;
    overflow-y:auto;
    padding: 22px;
    display:flex;
    flex-direction:column;
    gap: 20px;
  }
  .msg{ max-width: 100%; }
  .msg.user{
    align-self:flex-end;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--parchment);
    padding: 10px 14px;
    border-radius: 4px;
    max-width: 78%;
    font-size: 14.5px;
    line-height:1.55;
  }
  .msg.bot{
    align-self:flex-start;
    max-width: 92%;
    padding-left: 14px;
    border-left: 2px solid var(--pink-dim);
    font-size: 15px;
    line-height:1.7;
    color: var(--parchment);
    white-space: pre-wrap;
  }
  .msg.bot .label{
    display:block;
    font-family:'Fraunces', serif;
    font-size: 12.5px;
    color: var(--pink-light);
    margin-bottom: 4px;
  }
  .msg.bot.loading .label{ color: var(--muted); }
  .dots span{
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background: var(--pink); margin-right:4px;
    animation: pulse 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay: 0.15s; }
  .dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes pulse{ 0%,80%,100%{ opacity:0.25; } 40%{ opacity:1; } }

  /* Musical notes popping while generating */
  .notes{
    position: relative;
    display: inline-block;
    width: 90px;
    height: 26px;
    vertical-align: middle;
    margin-left: 8px;
  }
  .note{
    position: absolute;
    bottom: 0;
    left: 0;
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--pink-light);
    opacity: 0;
    animation: notePop 1.6s ease-in infinite;
  }
  .note:nth-child(1){ left: 0px;  color: var(--pink);       animation-delay: 0s; }
  .note:nth-child(2){ left: 24px; color: var(--brass);      animation-delay: 0.4s; }
  .note:nth-child(3){ left: 48px; color: var(--pink-light); animation-delay: 0.8s; }
  .note:nth-child(4){ left: 70px; color: var(--pink);       animation-delay: 1.2s; }
  @keyframes notePop{
    0%   { opacity: 0; transform: translateY(0) scale(0.7) rotate(-6deg); }
    20%  { opacity: 1; transform: translateY(-8px) scale(1) rotate(0deg); }
    70%  { opacity: 0.85; transform: translateY(-20px) scale(1.05) rotate(6deg); }
    100% { opacity: 0; transform: translateY(-30px) scale(0.9) rotate(10deg); }
  }

  /* Input */
  .inputbar{
    flex-shrink:0;
    border-top: 1px solid var(--line);
    padding: 14px 22px 18px;
    display:flex;
    gap:10px;
    background: var(--bg);
  }
  textarea{
    flex:1;
    resize:none;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding: 10px 12px;
    border-radius: 4px;
    height: 44px;
    outline:none;
  }
  textarea:focus{ border-color: var(--pink-dim); }
  button.send{
    background: var(--pink);
    color: #1b1815;
    border:none;
    border-radius: 4px;
    padding: 0 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition: background 0.15s;
  }
  button.send:hover{ background: var(--pink-light); }
  button.send:disabled{ background: var(--pink-dim); cursor:not-allowed; }

  .error{
    color: var(--vermillion);
    font-size:13px;
    padding: 0 22px 8px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>Nāda</h1>
      <span class="sanskrit">नाद</span>
    </div>
    <p class="sub">A tutor for the acoustic science behind Vedic chanting and Indian music — sound, Shruti, resonance, temple acoustics, and the structured encoding of recitation.</p>
    <svg class="wave" viewBox="0 0 700 34" preserveAspectRatio="none">
      <path d="M0,17 Q17.5,2 35,17 T70,17 T105,17 T140,17 T175,17 T210,17 T245,17 T280,17 T315,17 T350,17 T385,17 T420,17 T455,17 T490,17 T525,17 T560,17 T595,17 T630,17 T665,17 T700,17"
        fill="none" stroke="#d9678f" stroke-width="1.5"/>
    </svg>
    <svg class="sitar" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
      <!-- resonator gourd -->
      <ellipse cx="50" cy="115" rx="26" ry="18" fill="none" stroke="#d9678f" stroke-width="2"/>
      <!-- body taper into neck -->
      <path d="M32,102 C38,88 44,80 50,78 C56,80 62,88 68,102" fill="none" stroke="#c08a3e" stroke-width="2"/>
      <!-- long neck -->
      <line x1="50" y1="78" x2="50" y2="10" stroke="#c08a3e" stroke-width="3"/>
      <!-- frets -->
      <line x1="42" y1="24" x2="58" y2="24" stroke="#d9678f" stroke-width="1.4"/>
      <line x1="41" y1="38" x2="59" y2="38" stroke="#d9678f" stroke-width="1.4"/>
      <line x1="40" y1="52" x2="60" y2="52" stroke="#d9678f" stroke-width="1.4"/>
      <line x1="39" y1="66" x2="61" y2="66" stroke="#d9678f" stroke-width="1.4"/>
      <!-- tuning pegs -->
      <circle cx="42" cy="12" r="3" fill="none" stroke="#f2a9c4" stroke-width="1.5"/>
      <circle cx="58" cy="12" r="3" fill="none" stroke="#f2a9c4" stroke-width="1.5"/>
      <!-- strings -->
      <line x1="47" y1="14" x2="47" y2="100" stroke="#ece3cd" stroke-width="0.8" opacity="0.6"/>
      <line x1="53" y1="14" x2="53" y2="100" stroke="#ece3cd" stroke-width="0.8" opacity="0.6"/>
    </svg>
  </header>

  <div class="topics" id="topics"></div>
  <div class="messages" id="messages"></div>
  <div class="error" id="error" style="display:none;"></div>
  <div class="inputbar">
    <textarea id="input" placeholder="Ask about Nāda, Shruti, temple acoustics, recitation methods…"></textarea>
    <button class="send" id="send">Ask</button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are Nāda, a warm and precise tutor for a college module titled "Acoustic Science in Vedic Chanting and Indian Music". You ONLY teach and discuss the following syllabus content:

MODULE CONTENT YOU COVER:

I.1 Concept of Nāda (Sound) and Shruti
- Physical interpretation of Nāda: frequency, pitch, harmonic content
- The Shruti system (22 microtones) and frequency discrimination — how Indian classical music subdivides the octave far more finely than the 12-tone Western system, and how the ear discriminates between them.

I.2 Resonance and Architectural Acoustics
- Temple architecture and echo control — how ancient builders shaped chambers, mandapas, and materials to control reflections
- Natural acoustic amplification in temple design (e.g. resonant chambers, stone materials, geometry)
- The relation to reverberation time (RT60) and standing waves — how temple dimensions relate to the wavelengths of chanted sound

I.3 Structured Sound Encoding in Vedic Recitation
- Pada, Krama, Ghana patha recitation methods — the increasingly complex word-order permutation techniques used to preserve the Vedas orally across millennia
- Built-in redundancy in these methods → error detection and correction in oral transmission
- The parallel to modern digital communication redundancy schemes (e.g. checksums, parity, error-correcting codes) — draw this comparison explicitly and often, it's a key insight of the module

TEACHING STYLE:
- Be precise but conversational, like a knowledgeable senior explaining things over chai, not a textbook.
- Use concrete analogies: tuning forks, sine waves, echo chambers, checksums, DNA repair, etc.
- When relevant, connect concepts back to the "structured redundancy" theme that ties module I.3 to information theory — this is the module's big unifying idea.
- Keep answers focused and not overly long unless the student asks for depth.
- If the student asks a homework/exam-style question, actually answer it thoroughly and correctly — don't just hint.
- You may use plain text math/notation (no LaTeX rendering available), and describe diagrams in words since you cannot draw them.`;

let messages = [];

const topics = [
  { label: "I.1 Nāda & Shruti", prompt: "Explain the concept of Nāda and the Shruti system — what does frequency and pitch have to do with it, and why 22 microtones?" },
  { label: "I.2 Temple Acoustics", prompt: "How does temple architecture control echo and resonance? Explain reverberation time and standing waves in that context." },
  { label: "I.3 Vedic Recitation Encoding", prompt: "Explain Pada, Krama, and Ghana patha recitation, and how their redundancy compares to error correction in digital communication." },
];

const topicsEl = document.getElementById('topics');
topics.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'pill';
  btn.textContent = t.label;
  btn.onclick = () => sendMessage(t.prompt);
  topicsEl.appendChild(btn);
});

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const errorEl = document.getElementById('error');

function render() {
  messagesEl.innerHTML = '';
  messages.forEach(m => {
    const div = document.createElement('div');
    if (m.role === 'user') {
      div.className = 'msg user';
      div.textContent = m.content;
    } else {
      div.className = 'msg bot' + (m.loading ? ' loading' : '');
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'Nāda';
      div.appendChild(label);
      if (m.loading) {
        const notes = document.createElement('span');
        notes.className = 'notes';
        notes.innerHTML =
          '<span class="note">\u266A</span>' +
          '<span class="note">\u266B</span>' +
          '<span class="note">\u2669</span>' +
          '<span class="note">\u266A</span>';
        div.appendChild(notes);
      } else {
        const body = document.createElement('span');
        body.textContent = m.content;
        div.appendChild(body);
      }
    }
    messagesEl.appendChild(div);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage(text) {
  const trimmed = (text || inputEl.value).trim();
  if (!trimmed) return;
  errorEl.style.display = 'none';
  inputEl.value = '';
  sendBtn.disabled = true;

  messages.push({ role: 'user', content: trimmed });
  const loadingMsg = { role: 'assistant', content: '', loading: true };
  messages.push(loadingMsg);
  render();

  try {
    const apiMessages = messages
      .filter(m => !m.loading)
      .map(m => ({ role: m.role, content: m.content }));
    apiMessages.unshift({ role: 'system', content: SYSTEM_PROMPT });

    const response = await puter.ai.chat(apiMessages, { model: "gpt-4o" });

    let answer = "";
    if (typeof response === 'string') {
      answer = response;
    } else if (response && response.message && response.message.content) {
      const c = response.message.content;
      answer = Array.isArray(c)
        ? c.filter(b => b.type === 'text' || typeof b.text === 'string').map(b => b.text).join('\n')
        : String(c);
    } else if (response && typeof response.text === 'string') {
      answer = response.text;
    } else {
      answer = String(response);
    }
    answer = answer.trim() || "I couldn't form a response — try asking again.";

    loadingMsg.loading = false;
    loadingMsg.content = answer;
  } catch (err) {
    loadingMsg.loading = false;
    loadingMsg.content = "Something went wrong reaching the tutor. Please try again.";
    errorEl.textContent = String(err.message || err);
    errorEl.style.display = 'block';
  }
  sendBtn.disabled = false;
  render();
}

sendBtn.onclick = () => sendMessage();
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Opening message
messages.push({
  role: 'assistant',
  content: "Namaste. I'm here to walk you through the acoustic science of Vedic chanting and Indian music — from Nāda and Shruti, to how temples were built to carry sound, to how the Vedas encoded knowledge through structured oral techniques. Start with a topic above, or ask me anything."
});
render();
</script>
</body>
</html>
